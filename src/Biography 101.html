<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Source Serif 4', Georgia, serif;
    background: #0a0908;
    color: #1A1715;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    height: 100vh;
    margin: 0;
  }
  ::selection { background: #D4BFC6; color: #1A1715; }
  body::-webkit-scrollbar { width: 8px; }
  body::-webkit-scrollbar-track { background: #EBE4DB; }
  body::-webkit-scrollbar-thumb { background: #A88B96; border-radius: 4px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.05); }
  }
  @keyframes bounceDown {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(6px); }
  }
  @keyframes marquee {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  @keyframes expandBar {
    from { transform: scaleX(0); opacity: 0; }
    to { transform: scaleX(1); opacity: 1; }
  }
  @keyframes shimmer {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  @keyframes slideIn {
    0%   { opacity: 0; transform: scale(1.08); filter: blur(18px) brightness(1.4); clip-path: inset(0 50% 0 50%); }
    40%  { opacity: 1; filter: blur(6px) brightness(1.1); clip-path: inset(0 0 0 0); }
    100% { opacity: 1; transform: scale(1); filter: blur(0) brightness(1); clip-path: inset(0 0 0 0); }
  }
  @keyframes slideOut {
    0%   { opacity: 1; transform: scale(1); filter: blur(0); clip-path: inset(0 0 0 0); }
    60%  { opacity: 0.5; transform: scale(0.94); filter: blur(10px) brightness(0.6); }
    100% { opacity: 0; transform: scale(0.88); filter: blur(24px) brightness(0.3); clip-path: inset(0 40% 0 40%); }
  }
  @keyframes filmFlash {
    0%, 100% { opacity: 0; }
    20% { opacity: 0.9; }
  }
  @keyframes morphRise {
    0% { opacity: 0; transform: translateY(40px) scale(0.98); filter: blur(8px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  .slide-content > * {
    animation: morphRise 1.1s cubic-bezier(.2,.7,.2,1) both;
    animation-delay: 0.35s;
  }
  /* Hide scrollbars on internally-scrollable slides */
  [data-section]::-webkit-scrollbar { width: 0; height: 0; }
  [data-section] { scrollbar-width: none; }
  button { font-family: inherit; }
  img { display: block; max-width: 100%; }
</style>
