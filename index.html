<script>
  // Populate window.__resources from the ext-resource-dependency meta tags so
  // the React app can reference assets via window.__resources.r_* without the
  // bundler. Runs before any other script so __resources is ready at load.
  (function () {
    var map = {};
    var metas = document.querySelectorAll('meta[name="ext-resource-dependency"]');
    for (var i = 0; i < metas.length; i++) {
      var m = metas[i];
      var id = m.getAttribute('data-resource-id');
      var path = m.getAttribute('content');
      if (id && path) map[id] = path;
    }
    window.__resources = map;
  })();
</script>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// Palette
const P = {
  bg: "#E5D3D9", bg2: "#D4BFC6", bg3: "#BFA8AE",
  mv: "#A88B96", mvd: "#7E6570", mvl: "#EFDCE2",
  ch: "#1A1715", ch2: "#2C2825", ts: "#5A524B", tm: "#9A8E82",
  amber: "#C8A96E", sage: "#7B8F6A"
};
const sf = "'Cormorant Garamond', Georgia, serif";
const ss = "'Source Serif 4', 'Source Serif Pro', Georgia, serif";
const mn = "'IBM Plex Mono', 'Courier New', monospace";

// ==================== HOOKS ====================
function useInView(threshold = 0.2) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const root = document.querySelector("[data-scroll-container]") || null;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) setInView(true);
    }, { root, threshold });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, [threshold]);
  return [ref, inView];
}

function useScrollProgress(ref) {
  const [p, setP] = useState(0);
  useEffect(() => {
    const container = document.querySelector("[data-scroll-container]") || window;
    const onScroll = () => {
      if (!ref.current) return;
      const r = ref.current.getBoundingClientRect();
      const wh = window.innerHeight;
      const prog = 1 - (r.top + r.height) / (wh + r.height);
      setP(Math.max(0, Math.min(1, prog)));
    };
    onScroll();
    container.addEventListener('scroll', onScroll, { passive: true });
    return () => container.removeEventListener('scroll', onScroll);
  }, [ref]);
  return p;
}

function useMouse() {
  const [m, setM] = useState({ x: 0.5, y: 0.5 });
  useEffect(() => {
    const on = (e) => setM({ x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight });
    window.addEventListener('mousemove', on);
    return () => window.removeEventListener('mousemove', on);
  }, []);
  return m;
}

function useResponsive() {
  const [bp, setBp] = useState({ w: window.innerWidth, mobile: window.innerWidth < 768, tablet: window.innerWidth >= 768 && window.innerWidth < 1024, desktop: window.innerWidth >= 1024 });
  useEffect(() => {
    const onResize = () => {
      const w = window.innerWidth;
      setBp({ w, mobile: w < 768, tablet: w >= 768 && w < 1024, desktop: w >= 1024 });
    };
    window.addEventListener('resize', onResize, { passive: true });
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return bp;
}

function useSwipe(onSwipeLeft, onSwipeRight) {
  const [touch, setTouch] = useState({ x: 0, y: 0 });
  useEffect(() => {
    const onTouchStart = (e) => {
      setTouch({ x: e.touches[0].clientX, y: e.touches[0].clientY });
    };
    const onTouchEnd = (e) => {
      const dx = touch.x - e.changedTouches[0].clientX;
      const dy = touch.y - e.changedTouches[0].clientY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
        if (dx > 0 && onSwipeLeft) onSwipeLeft();
        else if (dx < 0 && onSwipeRight) onSwipeRight();
      }
    };
    document.addEventListener('touchstart', onTouchStart, { passive: true });
    document.addEventListener('touchend', onTouchEnd, { passive: true });
    return () => {
      document.removeEventListener('touchstart', onTouchStart);
      document.removeEventListener('touchend', onTouchEnd);
    };
  }, [touch, onSwipeLeft, onSwipeRight]);
}

// ==================== SLIDE FRAME (16:9, scales to viewport) ====================
function SlideFrame({ children, bg = "#E5D3D9", id }) {
  const [scale, setScale] = useState(1);
  const outerRef = useRef(null);

  useEffect(() => {
    const fit = () => {
      if (!outerRef.current) return;
      const r = outerRef.current.getBoundingClientRect();
      setScale(Math.min(r.width / 1920, r.height / 1080));
    };
    fit();
    const ro = new ResizeObserver(fit);
    if (outerRef.current) ro.observe(outerRef.current);
    window.addEventListener("resize", fit);
    return () => { ro.disconnect(); window.removeEventListener("resize", fit); };
  }, []);

  return (
    <div ref={outerRef} data-slide-frame data-section={id} style={{
      position: "relative",
      width: "100vw",
      height: "100vh",
      background: bg,
      display: "flex", alignItems: "center", justifyContent: "center",
      overflow: "hidden",
      scrollSnapAlign: "start",
      flexShrink: 0
    }}>
      <div style={{
        width: 1920, height: 1080,
        transform: `scale(${scale})`,
        transformOrigin: "center center",
        position: "relative",
        flexShrink: 0
      }}>
        {children}
      </div>
    </div>
  );
}

// ==================== PRIMITIVES ====================
function Reveal({ children, delay = 0, y = 30, as: Tag = "div", style = {}, className = "" }) {
  const [ref, inView] = useInView(0.15);
  return (
    <Tag ref={ref} className={className} style={{
      ...style,
      opacity: inView ? 1 : 0,
      transform: inView ? "translateY(0)" : `translateY(${y}px)`,
      transition: `opacity 1.2s cubic-bezier(.2,.7,.2,1) ${delay}ms, transform 1.2s cubic-bezier(.2,.7,.2,1) ${delay}ms`
    }}>{children}</Tag>
  );
}

function SplitReveal({ text, delay = 0, stagger = 30, style = {}, em = [] }) {
  const [ref, inView] = useInView(0.25);
  const words = text.split(" ");
  return (
    <span ref={ref} style={{ display: "inline-block", ...style }}>
      {words.map((w, i) => (
        <span key={i} style={{ display: "inline-block", overflow: "hidden", verticalAlign: "top", marginRight: "0.25em" }}>
          <span style={{
            display: "inline-block",
            transform: inView ? "translateY(0)" : "translateY(110%)",
            opacity: inView ? 1 : 0,
            transition: `transform 1s cubic-bezier(.2,.7,.2,1) ${delay + i * stagger}ms, opacity 1s ${delay + i * stagger}ms`,
            fontStyle: em.includes(i) ? "italic" : "normal",
            color: em.includes(i) ? P.mvd : "inherit"
          }}>{w}</span>
        </span>
      ))}
    </span>
  );
}

function Marquee({ items, speed = 40, style = {} }) {
  const content = [...items, ...items];
  return (
    <div style={{ overflow: "hidden", whiteSpace: "nowrap", ...style }}>
      <div style={{ display: "inline-block", animation: `marquee ${speed}s linear infinite` }}>
        {content.map((it, i) => (
          <span key={i} style={{ display: "inline-block", padding: "0 2rem" }}>{it}</span>
        ))}
      </div>
    </div>
  );
}

// Arabic marginalia — a quiet bilingual echo, not a full translation.
// Modern Arabic (IBM Plex Sans Arabic) — matches the Plex Mono family already in use.
function Ar({ children, size = 17, color, align = "right", italic = false, style = {} }) {
  return (
    <span dir="rtl" lang="ar" style={{
      fontFamily: "'IBM Plex Sans Arabic', 'Source Serif 4', sans-serif",
      fontSize: size,
      fontWeight: 400,
      fontStyle: italic ? "italic" : "normal",
      color: color || "inherit",
      letterSpacing: 0,
      lineHeight: 1.4,
      display: "inline-block",
      textAlign: align,
      direction: "rtl",
      unicodeBidi: "isolate",
      ...style
    }}>{children}</span>
  );
}

    if (on) audioRef.current.pause();

  };
  return [on, toggle];
}

function Episodes() {
  const [active, setActive] = useState(0);
  const [ref, inView] = useInView(0.1);
  const { mobile } = useResponsive();
  const [txStart, setTxStart] = useState(null);

  if (mobile) {
    const prev = () => setActive(i => Math.max(0, i - 1));
    const next = () => setActive(i => Math.min(EPS.length - 1, i + 1));
    const onTS  = (e) => setTxStart(e.touches[0].clientX);
    const onTE  = (e) => {
      if (txStart === null) return;
      const dx = txStart - e.changedTouches[0].clientX;
      if (Math.abs(dx) > 36) { dx > 0 ? next() : prev(); }
      setTxStart(null);

function SoundTab() {
  const [playing, setPlaying] = useState(false);
  const audioRef = useRef(null);
  const [bars, setBars] = useState(Array(40).fill(0.3));

  useEffect(() => {
    audioRef.current = new Audio(window.__resources.r_music_score_mp3);
    audioRef.current.loop = true;
    return () => audioRef.current?.pause();
  }, []);

  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => {
      setBars(b => b.map(() => 0.2 + Math.random() * 0.8));
    }, 120);
    return () => clearInterval(id);
  }, [playing]);

  const toggle = () => {
    if (playing) audioRef.current.pause();
    else audioRef.current.play().catch(() => {});
    setPlaying(!playing);
  };

  return (

              <Reveal delay={240}>

                  <div style={{ fontFamily: sf, fontSize: 32, fontWeight: 300, lineHeight: 1.1, marginBottom: 20, letterSpacing: "-0.01em", position: "relative" }}>
                    The foreman receives the same <em>camera</em>, the same <em>lens</em>, the same <em>light</em>, and the same <em>respect</em> as the chairman.
                  </div>
                  <div style={{
                    display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10,

                      ["THE CEO","Cooke S4 · 50mm"],
                      ["THE ARCHITECT + INTERIORS","Cooke S4 · 50mm"]

        {/* /Content */}

    </section>

// ==================== SCHEDULE — Gantt ====================
function Schedule() {
  const weeks = 8;
  const phases = [
    { n: "Pre-Production", start: 0, end: 1, items: ["Location scouting", "Subject briefing", "Shot list", "Music comp"], c: P.amber },
    { n: "Production", start: 1, end: 3, items: ["Principal photography", "9 interview setups", "B-roll", "Sound capture"], c: P.mvd },
    { n: "Post-Production", start: 2.5, end: 7, items: ["~3 eps / week", "Colour grade", "Sound mix", "Music integration"], c: P.sage },
    { n: "Rollout", start: 3, end: 8, items: ["Episode drops", "Social syndication", "Campaign support"], c: P.ch }
  ];
  const { mobile } = useResponsive();

  if (mobile) {
    return (
      <section data-screen-label="07 Schedule" style={{ position: "relative", width: "100%" }}>
        <div style={{ fontFamily: mn, fontSize: 11, letterSpacing: "0.3em", opacity: 0.6, marginBottom: 8, color: P.mvd }}>CH. 07</div>
        <div style={{ height: 1, background: P.bg3, margin: "0 0 32px" }}/>

        <h2 style={{
          fontFamily: sf, fontSize: 40, fontWeight: 300, lineHeight: 1.0,
          letterSpacing: "-0.02em", color: P.ch, margin: 0, marginBottom: 32
        }}>
          Eight weeks.<br/>
          <em style={{ color: P.mvd }}>Four phases. One rhythm.</em>
        </h2>

        {/* 4 phase cards */}
        {phases.map((p, i) => (
          <div key={i} style={{
            background: P.bg2, padding: 20,
            borderLeft: `4px solid ${p.c}`,
            marginBottom: 8
          }}>
            <div style={{ fontFamily: mn, fontSize: 10, letterSpacing: "0.3em", color: P.tm, marginBottom: 6 }}>
              PHASE 0{i+1}
            </div>
            <div style={{ fontFamily: sf, fontSize: 22, fontStyle: "italic", color: P.ch, marginBottom: 4 }}>{p.n}</div>
            <div style={{ fontFamily: mn, fontSize: 11, letterSpacing: "0.2em", color: P.mvd, marginBottom: 12 }}>
              {p.end - p.start} {p.end - p.start === 1 ? "WEEK" : "WEEKS"} · W{String(p.start + 1).padStart(2,"0")} — W{String(p.end).padStart(2,"0")}
            </div>
            {p.items.map((it, j) => (
              <div key={j} style={{
                fontFamily: ss, fontSize: 15, color: P.ts,
                padding: "5px 0", borderTop: j > 0 ? `1px solid ${P.bg3}` : "none"
              }}>— {it}</div>
            ))}
          </div>
        ))}
      </section>
    );
  }

  return (
    <section data-screen-label="07 Schedule" style={{
      position: "relative", width: 1920, height: 1080, background: P.bg,
      padding: "100px 120px", overflow: "hidden"
    }}>
      <div style={{ maxWidth: 1400, margin: "0 auto" }}>
        <div style={{ display: "flex", gap: 16, alignItems: "center", marginBottom: 48 }}>
          <span style={{ fontFamily: mn, fontSize: 12, letterSpacing: "0.3em", color: P.mvd }}>CH. 07</span>
          <span style={{ flex: 1, height: 1, background: P.bg3 }}/>
          <Ar size={18} color="rgba(26,23,21,0.5)" style={{ marginRight: 16 }}>جدول الإنتاج</Ar>
          <span style={{ fontFamily: mn, fontSize: 12, letterSpacing: "0.3em", color: P.tm }}>PRODUCTION SCHEDULE</span>
        </div>

        <h2 style={{
          fontFamily: sf, fontSize: "clamp(48px, 8vw, 120px)",
          fontWeight: 300, lineHeight: 0.95, letterSpacing: "-0.02em",
          color: P.ch, margin: 0, marginBottom: 80
        }}>
          <div><SplitReveal text="Eight weeks." /></div>
          <div style={{ fontStyle: "italic", color: P.mvd }}>
            <SplitReveal text="Four phases. One rhythm." delay={400} />
          </div>
        </h2>

        {/* Gantt */}
        <div style={{ marginBottom: 40 }}>
          {/* Week header */}
          <div style={{ display: "flex", gap: 0, marginBottom: 16, paddingLeft: 180 }}>
            {Array.from({ length: weeks }).map((_, i) => (
              <div key={i} style={{
                flex: 1,
                fontFamily: mn, fontSize: 12, letterSpacing: "0.2em",
                color: P.tm, paddingLeft: 8,
                borderLeft: `1px solid ${P.bg3}`
              }}>W{String(i + 1).padStart(2, "0")}</div>
            ))}
          </div>

          {phases.map((p, i) => (
            <Reveal key={i} delay={i * 150}>
              <div style={{
                display: "flex", alignItems: "center", marginBottom: 2,
                background: P.bg2
              }}>
                <div style={{
                  width: 180, padding: "20px 16px",
                  fontFamily: mn, fontSize: 13, letterSpacing: "0.2em",
                  color: P.ch, textTransform: "uppercase"
                }}>{p.n}</div>
                <div style={{ flex: 1, position: "relative", height: 52 }}>
                  {/* Grid */}
                  {Array.from({ length: weeks }).map((_, j) => (
                    <div key={j} style={{
                      position: "absolute", top: 0, bottom: 0,
                      left: `${(j / weeks) * 100}%`, width: 1, background: P.bg3

function App() {
  const [active, setActive] = useState("cover");
  const [menuOpen, setMenuOpen] = useState(false);
  const [audioOn, toggleAudio] = useAudioScore();

  const go = (id) => {
    const el = document.querySelector(`[data-section="${id}"]`);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  useEffect(() => {
    const onKey = (e) => {
      const i = SECS.findIndex(s => s.id === active);
      if (e.key === "ArrowDown" || e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
        if (i < SECS.length - 1) { e.preventDefault(); go(SECS[i+1].id); }
      } else if (e.key === "ArrowUp" || e.key === "ArrowLeft" || e.key === "PageUp") {
        if (i > 0) { e.preventDefault(); go(SECS[i-1].id); }
      } else if (e.key === "Escape") { setMenuOpen(false); }
      else if (e.key === "Home") { e.preventDefault(); go(SECS[0].id); }
      else if (e.key === "End") { e.preventDefault(); go(SECS[SECS.length-1].id); }
    };
    window.addEventListener("keydown", onKey, { passive: false });
    return () => window.removeEventListener("keydown", onKey);
  }, [active]);

  // Swipe navigation (horizontal only — does not conflict with vertical page scroll)
  useSwipe(
    () => { const i = SECS.findIndex(s => s.id === active); if (i < SECS.length - 1) go(SECS[i+1].id); },
    () => { const i = SECS.findIndex(s => s.id === active); if (i > 0) go(SECS[i-1].id); }
  );

  useEffect(() => {
    const sections = SECS.map(s => document.querySelector(`[data-section="${s.id}"]`)).filter(Boolean);
    const root = document.querySelector("[data-scroll-container]");
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) setActive(e.target.dataset.section);
      });
    }, { root, threshold: 0.4 });
    sections.forEach(s => obs.observe(s));
    return () => obs.disconnect();
  }, []);

  useEffect(() => {
    const i = SECS.findIndex(s => s.id === active);
    if (i >= 0 && window.parent) {
      window.parent.postMessage({ slideIndexChanged: i }, "*");
    }
  }, [active]);

  // Direct mobile check - no hook
  const isMobile = window.innerWidth < 1200;

  // Mobile: Long single-page layout
  if (isMobile) {
    return (
      <div data-scroll-container style={{
        background: "#0a0908",
        color: P.ch,
        width: "100vw",
        minHeight: "100vh",
        overflowY: "auto",
        overflowX: "hidden",
        scrollBehavior: "smooth",
        display: "flex",
        flexDirection: "column"
      }}>
        <TopBar />
        {/* Fullscreen index menu overlay only — dash-tower suppressed on mobile */}
        <SideNav active={active} onGo={go} open={menuOpen} setOpen={setMenuOpen} audioOn={audioOn} toggleAudio={toggleAudio} />
        {/* Bottom nav bar replaces the side dash-tower */}
        <MobileBottomNav active={active} onMenuOpen={() => setMenuOpen(true)} audioOn={audioOn} toggleAudio={toggleAudio} />

        {/* Mobile: purpose-built mobile layouts rendered as plain divs */}
        <div id="cover" data-section="cover" style={{ background: "#1A1715", padding: "0" }}>
          <Cover />
        </div>
        <div id="insight" data-section="insight" style={{ background: P.bg, padding: "60px 20px 40px" }}>
          <Insight />
        </div>
        <div id="overview" data-section="overview" style={{ background: "#1A1715", padding: "60px 20px 40px" }}>
          <Overview />
        </div>
        <div id="concept" data-section="concept" style={{ background: P.bg, padding: "60px 20px 40px" }}>
          <Concept />
        </div>
        <div id="episodes" data-section="episodes" style={{ background: "#2A2421", padding: "60px 20px 40px" }}>
          <Episodes />
        </div>
        <div id="craft" data-section="craft" style={{ background: P.bg2, padding: "60px 20px 40px" }}>
          <Craft />
        </div>
        <div id="atelier" data-section="atelier" style={{ background: P.bg, padding: "60px 20px 40px" }}>
          <Atelier />
        </div>
        <div id="schedule" data-section="schedule" style={{ background: P.bg, padding: "60px 20px 40px" }}>
          <Schedule />
        </div>
        <div id="rollout" data-section="rollout" style={{ background: "#1A1715", padding: "60px 20px 40px" }}>
          <Rollout />
        </div>
        {/* Bottom padding equals bottom nav bar height + safe area */}
        <div id="close" data-section="close" style={{ background: "#1A1715", padding: "0", paddingBottom: "80px" }}>
          <Close />
        </div>
      </div>
    );
  }

  // Desktop: Slide-based layout with SlideFrame
  console.log("✅ Rendering DESKTOP layout");
  return (
    <div data-scroll-container style={{
      background: P.bg,
      color: P.ch,
      height: "100vh",
      overflowY: "auto",
      overflowX: "hidden",
      scrollSnapType: "y mandatory",
      scrollBehavior: "smooth"
    }}>
      <TopBar />
      <SideNav active={active} onGo={go} open={menuOpen} setOpen={setMenuOpen} audioOn={audioOn} toggleAudio={toggleAudio} />
      <SlideFrame id="cover" bg="#1A1715"><Cover /></SlideFrame>
      <SlideFrame id="insight" bg={P.bg}><Insight /></SlideFrame>
      <SlideFrame id="overview" bg="#1A1715"><Overview /></SlideFrame>
      <SlideFrame id="concept" bg={P.bg}><Concept /></SlideFrame>
      <SlideFrame id="episodes" bg="#2A2421"><Episodes /></SlideFrame>
      <SlideFrame id="craft" bg="#D4BFC6"><Craft /></SlideFrame>
      <SlideFrame id="atelier" bg={P.bg}><Atelier /></SlideFrame>
      <SlideFrame id="schedule" bg={P.bg}><Schedule /></SlideFrame>
      <SlideFrame id="rollout" bg="#1A1715"><Rollout /></SlideFrame>
      <SlideFrame id="close" bg="#1A1715"><Close /></SlideFrame>
    </div>
  );
}

window.App = App;

</script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!-- Fullscreen toggle. Lives outside #root so React never re-renders it. -->
<button id="fs-toggle" type="button" aria-label="Toggle fullscreen" title="Fullscreen (F)">
  <svg class="fs-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square">
    <path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/>
  </svg>
  <svg class="fs-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square">
    <path d="M9 4v5H4"/><path d="M15 4v5h5"/><path d="M9 20v-5H4"/><path d="M15 20v-5h5"/>
  </svg>
</button>
<script>
  (function () {
    var btn = document.getElementById('fs-toggle');
    if (!btn) return;
    function inFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }
    function toggle() {
      if (inFullscreen()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        var el = document.documentElement;
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      }
    }
    btn.addEventListener('click', toggle);
    // Keyboard shortcut: press "f" to toggle (ignore when typing).
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'f' && e.key !== 'F') return;
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      e.preventDefault();
      toggle();
    });
  })();
</script>
